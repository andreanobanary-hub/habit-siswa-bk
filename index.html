<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jurnal Kebiasaan Positif Siswa - Bimbingan & Konseling</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-gradient-to-br from-slate-100 via-indigo-50/40 to-slate-200 min-h-screen text-slate-800 flex items-center justify-center p-3 sm:p-4">

  <!-- Container Utama -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-indigo-100/50 border border-slate-200/80 overflow-hidden transition-all duration-300">
    
    <!-- Header / Banner -->
    <div class="bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-600 text-white p-6 text-center relative">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-white/15 backdrop-blur-md rounded-full text-[11px] font-semibold tracking-wide text-indigo-100 uppercase mb-2">
        <i class="fa-solid fa-graduation-cap"></i> Layanan Bimbingan & Konseling
      </div>
      <h1 class="text-xl sm:text-2xl font-black tracking-tight">Jurnal Kebiasaan Siswa</h1>
      <p class="text-xs text-indigo-100/90 mt-1 max-w-xs mx-auto">Bangun disiplin diri, karakter positif, dan raih prestasi setiap hari</p>
    </div>

    <div class="p-5 sm:p-6 space-y-5">
      
      <!-- ================= STEP 1: FORM LOGIN / INPUT NIS ================= -->
      <div id="loginSection" class="space-y-4">
        <div class="text-center space-y-1 mb-2">
          <h2 class="text-sm font-bold text-slate-700">Masuk dengan NIS</h2>
          <p class="text-xs text-slate-500">Masukkan Nomor Induk Siswa untuk memulai check-in harian</p>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-600">Nomor Induk Siswa (NIS)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
              <i class="fa-solid fa-id-card"></i>
            </span>
            <input 
              id="inputNis" 
              type="text" 
              placeholder="Contoh: 1001" 
              class="w-full pl-10 pr-4 py-2.5 text-sm font-medium bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none transition"
              onkeypress="if(event.key === 'Enter') handleLogin()"
            />
          </div>
        </div>

        <button 
          onclick="handleLogin()" 
          id="btnLogin"
          class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold rounded-xl text-sm transition shadow-md shadow-indigo-200 flex items-center justify-center gap-2">
          <span>Masuk Jurnal</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>

        <div id="loginError" class="p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-600 font-medium text-center hidden"></div>
      </div>

      <!-- ================= STEP 2: DASHBOARD & CHECKLIST ================= -->
      <div id="appSection" class="hidden space-y-5">
        
        <!-- Profil & Streak Siswa -->
        <div class="bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-100/80 rounded-2xl p-4 flex justify-between items-center shadow-sm">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
              <i class="fa-regular fa-user"></i>
            </div>
            <div>
              <p class="font-bold text-slate-800 text-sm leading-tight" id="namaSiswa">-</p>
              <p class="text-xs text-slate-500 font-medium" id="kelasSiswa">-</p>
            </div>
          </div>
          <div class="text-right pl-3 border-l border-indigo-100">
            <div class="flex items-center justify-end gap-1 text-amber-500 font-extrabold text-sm sm:text-base">
              <span>🔥</span>
              <span id="streakSiswa">0</span>
              <span class="text-xs font-semibold text-slate-600">Hari</span>
            </div>
            <p class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Streak</p>
          </div>
        </div>

        <!-- Daftar Target / Habit -->
        <div class="space-y-2.5">
          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
              <i class="fa-solid fa-list-check text-indigo-600"></i> Target Hari Ini
            </h3>
            <span id="selectedCountBadge" class="text-[11px] font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">
              0 dipilih
            </span>
          </div>

          <!-- Container Habit List Dinamis -->
          <div id="habitsList" class="space-y-2"></div>
        </div>

        <!-- Refleksi Singkat -->
        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fa-regular fa-comment-dots text-indigo-600"></i> Refleksi & Tantangan Hari Ini
          </label>
          <textarea 
            id="refleksi" 
            rows="2" 
            placeholder="Tuliskan kendala atau hal positif yang kamu rasakan hari ini (opsional)..."
            class="w-full p-3 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none transition resize-none"></textarea>
        </div>

        <!-- Tombol Simpan -->
        <div class="pt-1">
          <button 
            onclick="submitCheckin()" 
            id="btnSubmit"
            class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold rounded-xl text-sm transition shadow-lg shadow-emerald-200 flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-check"></i>
            <span>Kirim Check-In Hari Ini</span>
          </button>
          
          <button 
            onclick="handleLogout()" 
            class="w-full mt-2 py-1.5 text-xs text-slate-400 hover:text-slate-600 font-medium transition text-center">
            Ganti / Keluar Akun
          </button>
        </div>

        <!-- Notifikasi Status -->
        <div id="submitStatus" class="p-3 rounded-xl text-xs font-medium text-center hidden"></div>
      </div>

    </div>

    <!-- Footer -->
    <div class="px-6 py-3 bg-slate-50 border-t border-slate-100 text-center text-[11px] text-slate-400 font-medium">
      Aplikasi Bimbingan & Konseling Sekolah
    </div>
  </div>

  <script>
    // URL Google Apps Script yang sudah disematkan
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzry7jH5iDjiLiDaWkeK2eruArdoBIuIfg71zuIrlSiciNp5CKp41oKKuheDXlTZf9IPA/exec";

    let currentUser = null;
    let habitData = [];

    // Fungsi Login Siswa
    async function handleLogin() {
      const nisInput = document.getElementById("inputNis");
      const nis = nisInput.value.trim();
      const err = document.getElementById("loginError");
      const btn = document.getElementById("btnLogin");

      if (!nis) {
        showError("Silakan masukkan NIS Anda terlebih dahulu.");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Memeriksa NIS...</span>`;
      err.classList.add("hidden");

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getData&nis=${encodeURIComponent(nis)}`);
        const data = await response.json();

        if (data.status === "success") {
          currentUser = data.user;
          habitData = data.habits || [];

          // Tampilkan profil siswa
          document.getElementById("namaSiswa").innerText = currentUser.nama;
          document.getElementById("kelasSiswa").innerText = `Kelas ${currentUser.kelas} • NIS: ${currentUser.nis}`;
          document.getElementById("streakSiswa").innerText = currentUser.streak;

          // Render daftar habits
          renderHabits(habitData);

          // Pindah tampilan
          document.getElementById("loginSection").classList.add("hidden");
          document.getElementById("appSection").classList.remove("hidden");
        } else {
          showError(data.message || "NIS tidak terdaftar di sistem.");
        }
      } catch (e) {
        showError("Gagal menghubungi server. Pastikan koneksi internet stabil.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Masuk Jurnal</span><i class="fa-solid fa-arrow-right text-xs"></i>`;
      }
    }

    function renderHabits(habits) {
      const container = document.getElementById("habitsList");
      container.innerHTML = "";

      if (!habits || habits.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 text-center py-3">Belum ada target harian yang aktif.</p>`;
        return;
      }

      habits.forEach(h => {
        const item = document.createElement("label");
        item.className = "flex items-start gap-3 p-3 bg-slate-50 hover:bg-indigo-50/50 border border-slate-200 hover:border-indigo-200 rounded-xl cursor-pointer transition select-none group";
        item.innerHTML = `
          <input 
            type="checkbox" 
            value="${h.id}" 
            data-title="${h.judul}"
            data-xp="${h.xp}" 
            onchange="updateSelectionCount()"
            class="habit-check mt-0.5 h-4 w-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 transition cursor-pointer" 
          />
          <div class="flex-1">
            <p class="text-xs font-semibold text-slate-700 group-hover:text-indigo-900 leading-snug">${h.judul}</p>
            <div class="flex items-center gap-2 mt-0.5">
              <span class="text-[10px] text-slate-400 font-medium">${h.kategori || 'Umum'}</span>
              <span class="text-[10px] text-indigo-600 font-semibold bg-indigo-50 px-1.5 py-0.2 rounded">+${h.xp} XP</span>
            </div>
          </div>
        `;
        container.appendChild(item);
      });

      updateSelectionCount();
    }

    function updateSelectionCount() {
      const count = document.querySelectorAll(".habit-check:checked").length;
      document.getElementById("selectedCountBadge").innerText = `${count} dipilih`;
    }

    // Simpan Check-in ke Google Sheets
    async function submitCheckin() {
      const checkedBoxes = document.querySelectorAll(".habit-check:checked");
      const statusBox = document.getElementById("submitStatus");
      const btn = document.getElementById("btnSubmit");

      if (checkedBoxes.length === 0) {
        showStatus("Pilih minimal satu target kebiasaan yang telah kamu selesaikan!", "warning");
        return;
      }

      const selectedHabits = Array.from(checkedBoxes).map(cb => cb.dataset.title || cb.value);
      let earnedXP = 0;
      checkedBoxes.forEach(cb => earnedXP += Number(cb.dataset.xp || 0));

      const payload = {
        nis: currentUser.nis,
        habitsSelesai: selectedHabits,
        refleksi: document.getElementById("refleksi").value.trim(),
        xpTotal: earnedXP
      };

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Menyimpan ke Sheets...</span>`;
      showStatus("Sedang mencatat kebiasaanmu ke lembar kerja BK...", "info");

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        // Sukses
        showStatus("🎉 Luar biasa! Jurnal kebiasaan harianmu berhasil disimpan.", "success");
        btn.innerHTML = `<i class="fa-solid fa-check"></i><span>Selesai Hari Ini</span>`;
        btn.classList.remove("bg-emerald-600", "hover:bg-emerald-700");
        btn.classList.add("bg-slate-400", "cursor-not-allowed");

        document.querySelectorAll(".habit-check").forEach(cb => cb.disabled = true);
        document.getElementById("refleksi").disabled = true;

      } catch (err) {
        showStatus("Gagal mengirim data. Silakan coba sesaat lagi.", "error");
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>Coba Kirim Ulang</span>`;
      }
    }

    function showError(msg) {
      const err = document.getElementById("loginError");
      err.innerText = msg;
      err.classList.remove("hidden");
    }

    function showStatus(msg, type) {
      const box = document.getElementById("submitStatus");
      box.classList.remove("hidden", "bg-red-50", "text-red-700", "border-red-200", "bg-emerald-50", "text-emerald-700", "border-emerald-200", "bg-indigo-50", "text-indigo-700", "border-indigo-200", "bg-amber-50", "text-amber-700", "border-amber-200");

      if (type === "success") {
        box.classList.add("bg-emerald-50", "text-emerald-700", "border", "border-emerald-200");
      } else if (type === "error") {
        box.classList.add("bg-red-50", "text-red-700", "border", "border-red-200");
      } else if (type === "warning") {
        box.classList.add("bg-amber-50", "text-amber-700", "border", "border-amber-200");
      } else {
        box.classList.add("bg-indigo-50", "text-indigo-700", "border", "border-indigo-200");
      }

      box.innerText = msg;
    }

    function handleLogout() {
      currentUser = null;
      document.getElementById("inputNis").value = "";
      document.getElementById("refleksi").value = "";
      document.getElementById("refleksi").disabled = false;
      document.getElementById("appSection").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
      document.getElementById("submitStatus").classList.add("hidden");

      const btn = document.getElementById("btnSubmit");
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>Kirim Check-In Hari Ini</span>`;
      btn.className = "w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold rounded-xl text-sm transition shadow-lg shadow-emerald-200 flex items-center justify-center gap-2";
    }
  </script>
</body>
</html>
